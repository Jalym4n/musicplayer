name: Build Aayusha's Music Player

# Builds the double-click app (with the built-in speaker inside) for Windows, macOS
# and Linux. Download the results from the run's "Artifacts" section.
on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a public release with this tag (e.g. v1.0.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: AayushaMusicPlayer-Windows
          - os: macos-latest
            artifact: AayushaMusicPlayer-macOS
          - os: ubuntu-22.04
            artifact: AayushaMusicPlayer-Linux
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      APP: "Aayusha's Music Player"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: build/librespot-root -> target
          cache-targets: false

      - name: Install Python packages
        run: python -m pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q

      - name: Build built-in speaker (librespot)
        run: python scripts/build_librespot.py

      - name: Build app
        run: python scripts/build.py

      - name: Smoke test bundled speaker
        shell: bash
        run: |
          bin=$(find dist -type f \( -name librespot -o -name librespot.exe \) | head -1)
          echo "speaker: $bin"
          test -n "$bin"
          "$bin" --version

      - name: Smoke test media keys (macOS)
        if: runner.os == 'macOS'
        run: '"dist/$APP.app/Contents/MacOS/$APP" --check-media-keys'

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/$APP.app" "${{ matrix.artifact }}.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/$env:APP" -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf "${{ matrix.artifact }}.tar.gz" "$APP"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  # One job publishes the release after all three builds pass, so anyone can download
  # the apps from the repo's Releases page without a GitHub account.
  release:
    needs: build
    # Publish for a pushed v* tag, a manual run with release_tag, or a pushed commit whose
    # message contains [release] (tag = "v" + __version__ from pinkie/__init__.py).
    if: >-
      startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the release tag
        id: tag
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then tag="${{ inputs.release_tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="$GITHUB_REF_NAME"
          else tag="v$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('pinkie/__init__.py').read()).group(1))")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release tag: $tag"

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "Aayusha's Music Player ${{ steps.tag.outputs.tag }}"
          make_latest: true
          files: out/*
          body: |
            ✨ Aayusha's Music Player 🦦 ✨

            **Mac (Apple Silicon):** download `AayushaMusicPlayer-macOS.zip`, unzip it, drag
            **Aayusha's Music Player.app** into Applications, then run once in Terminal:

            ```
            xattr -dr com.apple.quarantine "/Applications/Aayusha's Music Player.app"
            ```

            **Windows:** download `AayushaMusicPlayer-Windows.zip`, unzip, run the `.exe`
            (SmartScreen: More info → Run anyway).

            **Linux:** download `AayushaMusicPlayer-Linux.tar.gz`, extract, run the app.

            First launch: paste the Spotify Client ID, then Settings → get my key (Soloist) →
            download Soloist from Spotify → save, and pick "Aayusha's Player" once in the
            Spotify app on your phone. Full guide: see the README.
